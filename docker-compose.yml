services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: adms
      POSTGRES_PASSWORD: adms
      POSTGRES_DB: adms
    ports:
      # Localhost-only, so `npm test`/`prisma migrate dev` running on the
      # host (not inside a container) can reach it - matches DATABASE_URL
      # in .env.example. Bound to 127.0.0.1 rather than every interface so
      # this dev DB is never reachable from outside the host machine.
      - "127.0.0.1:5432:5432"
    volumes:
      - adms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adms"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies migrations then exits. server/worker wait for this to
  # finish successfully before they start, so a plain `docker compose up`
  # never races multiple containers against the schema.
  migrate:
    build: .
    command: npx prisma migrate deploy
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://adms:adms@postgres:5432/adms

  server:
    build: .
    command: node dist/server.js
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://adms:adms@postgres:5432/adms
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_SESSION_COOKIE_NAME: adms_admin
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      ADMS_MAX_BODY_SIZE: ${ADMS_MAX_BODY_SIZE:-10mb}
      DEVICE_OFFLINE_THRESHOLD_MS: ${DEVICE_OFFLINE_THRESHOLD_MS:-300000}
    ports:
      - "8080:8080"
    healthcheck:
      # No curl/wget guaranteed in the image - Node 20's global fetch avoids
      # depending on what's actually installed in the base image.
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build: .
    command: node dist/worker.js
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://adms:adms@postgres:5432/adms
      # worker.ts never actually signs/verifies a JWT (only src/admin/jwt.ts
      # does, which only server.ts's request handlers ever call) - but it
      # imports the same shared src/config.ts as server.ts, which validates
      # every env var eagerly at import time regardless of which fields the
      # importing entry point actually reads. Omitting this here used to be
      # harmless because config.ts had an insecure fallback default; once
      # that fallback was removed (JWT_SECRET became a hard requirement,
      # correctly, since server.ts does need a real one), the worker
      # container had nothing to satisfy that check and crash-looped on
      # every boot.
      JWT_SECRET: ${JWT_SECRET}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-5}
      WEBHOOK_TIMEOUT_MS: ${WEBHOOK_TIMEOUT_MS:-8000}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-3000}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-50}

volumes:
  adms_pgdata:
